<!DOCTYPE html>
<html lang="en">
<head>

  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <link rel="apple-touch-icon" sizes="180x180" href="./static/assets/apple-icon-180x180.png">

  <title>{% block title %}Rohit Shende — AI Engineer{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

</head>

<body>

  <div class="grain"></div>

    <div class="container nav-wrap">

        <span></span><span></span><span></span>

      <nav class="site-nav" id="siteNav">

        <a href="./works.html" class="{{ 'active' if active == 'works' else '' }}">Works</a>
        <a href="./about.html" class="{{ 'active' if active == 'about' else '' }}">About</a>
        <a href="./contact.html" class="{{ 'active' if active == 'contact' else '' }}">Contact</a>
        <a href="./blog.html" class="{{ 'active' if active == 'blog' else '' }}">Blog</a>

        <div class="nav-social">
          <a href="https://www.linkedin.com/in/rohit-shende-ml/" target="_blank" rel="noopener" aria-label="LinkedIn">

          <a href="mailto:rohitshende020@gmail.com" aria-label="Email">

    </div>

  <main>
    {% block content %}{% endblock %}

      <p>&copy; <span id="year"></span> Rohit Shende &middot; hand-built in Nagpur, India</p>

        <a href="mailto:rohitshende020@gmail.com" aria-label="Email">

        </a>
      </div>
    </div>
  </footer>

  <!-- Pixel bot: greets on arrival, eyes track the cursor -->
  <div class="bot" id="bot" role="button" tabindex="0" aria-label="Say hi to the bot">
    <div class="bot-bubble" id="botBubble"></div>

    <svg class="bot-sprite" viewBox="0 0 16 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <!-- antenna -->
      <rect x="7" y="0" width="2" height="2" fill="#fe8019"/>
      <rect x="7" y="2" width="2" height="1" fill="#7c6f64"/>
      <!-- ears -->
      <rect x="1" y="6" width="1" height="3" fill="#7c6f64"/>
      <rect x="14" y="6" width="1" height="3" fill="#7c6f64"/>
      <!-- head shell -->
      <rect x="2" y="3" width="12" height="9" fill="#a89984"/>
      <rect x="2" y="3" width="12" height="1" fill="#c9bda6"/>
      <!-- face screen -->
      <rect x="3" y="4" width="10" height="7" fill="#1a1714"/>
      <!-- eyes: sclera -->
      <rect x="4" y="6" width="3" height="3" fill="#3c352b"/>
      <rect x="9" y="6" width="3" height="3" fill="#3c352b"/>
      <!-- eyes: pupils (moved by JS) -->
      <rect id="botPupilL" x="5" y="7" width="1" height="1" fill="#b8bb26"/>
      <rect id="botPupilR" x="10" y="7" width="1" height="1" fill="#b8bb26"/>
      <!-- eyelids (blink) -->
      <rect class="bot-lid" x="4" y="6" width="3" height="3" fill="#a89984"/>
      <rect class="bot-lid" x="9" y="6" width="3" height="3" fill="#a89984"/>
      <!-- mouth -->
      <rect x="6" y="10" width="4" height="1" fill="#b8bb26"/>
      <!-- neck -->
      <rect x="7" y="12" width="2" height="1" fill="#7c6f64"/>
      <!-- body -->
      <rect x="3" y="13" width="10" height="4" fill="#a89984"/>
      <rect x="6" y="14" width="4" height="2" fill="#3c352b"/>
      <rect x="7" y="14" width="1" height="1" fill="#fabd2f"/>
      <!-- arms -->
      <rect x="1" y="14" width="2" height="2" fill="#7c6f64"/>
      <rect x="13" y="14" width="2" height="2" fill="#7c6f64"/>
      <!-- legs -->
      <rect x="5" y="17" width="2" height="1" fill="#7c6f64"/>
      <rect x="9" y="17" width="2" height="1" fill="#7c6f64"/>
    </svg>
  </div>

  <script src="./static/js/main.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
